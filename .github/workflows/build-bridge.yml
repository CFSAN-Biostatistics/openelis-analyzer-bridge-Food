name: Build and Publish Custom Analyzer Bridge

on:
  push:
    branches: [food-env] # Or your preferred branch
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build and Publish Bridge to Quay.io
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Build astm-http-lib submodule
        run: mvn -pl astm-http-lib -am clean install -DskipTests

      - name: Inject Secure Configuration Placeholders
        run: |
          mkdir -p src/main/resources
          cat << 'EOF' > src/main/resources/application.properties
          # These values are secure placeholders to be overridden by Docker Compose
          org.itech.ahb.forward-http-server.uri=${FORWARD_URI}
          org.itech.ahb.forward-http-server.health-uri=${FORWARD_HEALTH_URI}
          org.itech.ahb.forward-http-server.insecure-tls=${FORWARD_INSECURE_TLS:true}
          management.endpoint.health.show-details=${HEALTH_SHOW_DETAILS:always}
          bridge.security.password=${BRIDGE_PASS:changeme}
          EOF

      - name: Build Main Project
        run: mvn clean package -DskipTests

      - name: Authenticate to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USER }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: quay.io/galaxytrakr/openelis-analyzer-bridge:latest
          cache-from: type=registry,ref=quay.io/galaxytrakr/openelis-analyzer-bridge:buildcache
          cache-to: type=registry,ref=quay.io/galaxytrakr/openelis-analyzer-bridge:buildcache,mode=max
