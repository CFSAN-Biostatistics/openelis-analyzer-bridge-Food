name: Build and Publish Custom Analyzer Bridge (Debug-Ready)

on:
  push:
    branches: [food-env]
  workflow_dispatch:

jobs:
  build-and-publish-bridge:
    name: Build and Publish Corrected Bridge Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Analyzer Bridge Source Code
        uses: actions/checkout@v4
        with:
          # Checks out the official bridge source code into a subfolder
          repository: DIGI-UW/openelis-analyzer-bridge
          path: bridge-source
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      # 1. Inject the configuration properties directly into resources before packaging
      - name: Inject Secure Configuration Placeholders
        working-directory: ./bridge-source
        run: |
          mkdir -p src/main/resources
          cat << 'EOF' > src/main/resources/application.properties
          # Public default placeholders. Handled securely via docker-compose envs on-host.
          org.itech.ahb.forward-http-server.uri=${FORWARD_URI:https://localhost:8443}
          org.itech.ahb.forward-http-server.health-uri=${FORWARD_HEALTH_URI:https://localhost:8443/health}
          org.itech.ahb.forward-http-server.insecure-tls=${FORWARD_INSECURE_TLS:false}
          management.endpoint.health.show-details=${HEALTH_SHOW_DETAILS:never}
          bridge.security.password=${BRIDGE_PASS:changeme}
          bridge.security.username=${BRIDGE_USER:bridge}
          bridge.auth.password=${BRIDGE_PASS:changeme}
          bridge.auth.username=${BRIDGE_USER:bridge}
          EOF

      # 2. Compile the multi-module dependencies inside the actions runner
      - name: Build astm-http-lib submodule
        working-directory: ./bridge-source/astm-http-lib
        run: mvn -B clean install -DskipTests

      - name: Build main project
        working-directory: ./bridge-source
        run: mvn -B clean package -DskipTests
        
      # 3. Generate a custom, diagnostic-rich Dockerfile on-the-fly
      - name: Generate Debug-Ready Dockerfile
        run: |
          cat << 'EOF' > ./bridge-source/Dockerfile
          # Use the full JDK image for debugging tools like jcmd and jps
          FROM eclipse-temurin:21-jdk-alpine

          # Install standard diagnostic tools including vim/vi
          RUN apk add --no-cache curl socat iptables procps vim gcompat

          WORKDIR /app

          # Copy the compiled JAR directly into the final layer
          COPY target/*.jar /app/openelis-analyzer-bridge.jar

          EXPOSE 8443

          # Run as root so you can execute any networking command instantly in live shells
          USER root
          ENTRYPOINT ["java", "-jar", "/app/openelis-analyzer-bridge.jar"]
          EOF

      - name: Authenticate to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USER }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Build and Push the final container to your registry
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./bridge-source
          push: true
          tags: quay.io/galaxytrakr/openelis-analyzer-bridge:latest
          cache-from: type=registry,ref=quay.io/galaxytrakr/openelis-analyzer-bridge:buildcache
          cache-to: type=registry,ref=quay.io/galaxytrakr/openelis-analyzer-bridge:buildcache,mode=max
