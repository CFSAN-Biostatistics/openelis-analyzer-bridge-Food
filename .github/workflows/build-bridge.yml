  # CORRECTED PARALLEL BRIDGE BUILD JOB 🚀
  build-and-publish-bridge:
    name: Build + Publish Bridge Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Analyzer Bridge Repository
        uses: actions/checkout@v4
        with:
          repository: DIGI-UW/openelis-analyzer-bridge
          path: bridge-repo
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven # Added automatic maven dependency caching

      # 1. Inject public placeholders directly into the resources folder
      - name: Inject Secure Configuration Placeholders
        working-directory: ./bridge-repo
        run: |
          mkdir -p src/main/resources
          cat << 'EOF' > src/main/resources/application.properties
          # Public default placeholders. Handled securely via docker-compose envs on-host.
          org.itech.ahb.forward-http-server.uri=${FORWARD_URI:https://localhost:8443}
          org.itech.ahb.forward-http-server.health-uri=${FORWARD_HEALTH_URI:https://localhost:8443/health}
          org.itech.ahb.forward-http-server.insecure-tls=${FORWARD_INSECURE_TLS:false}
          management.endpoint.health.show-details=${HEALTH_SHOW_DETAILS:never}
          bridge.security.password=${BRIDGE_PASS:changeme}
          bridge.security.username=${BRIDGE_USER:bridge}
          bridge.auth.password=${BRIDGE_PASS:changeme}
          bridge.auth.username=${BRIDGE_USER:bridge}
          EOF

      # 2. Build the dependency library FIRST (No clean step on the main package afterward!)
      - name: Build library first
        working-directory: ./bridge-repo/astm-http-lib
        run: mvn clean install

      # 3. Build the main bridge package WITHOUT running 'clean' (which would delete the library target)
      - name: Build main project
        working-directory: ./bridge-repo
        run: mvn package -DskipTests

      - name: Authenticate to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USER }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Build and Push using the pre-built jar artifacts
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./bridge-repo
          push: true
          tags: quay.io/galaxytrakr/openelis-analyzer-bridge:latest
          cache-from: type=registry,ref=quay.io/galaxytrakr/openelis-analyzer-bridge:buildcache
          cache-to: type=registry,ref=quay.io/galaxytrakr/openelis-analyzer-bridge:buildcache,mode=max
